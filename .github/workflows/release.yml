name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.1). Leave empty for a test build."
        required: false
        default: ""
      notes_only:
        description: "Only replace the notes of an existing release with docs/releases/<tag>.md"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !inputs.notes_only }}
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download the face model
        run: python tools/get_model.py

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/test_core.py

      - name: Create icon
        run: python tools/make_icon.py


      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name Blinkythm
          --icon assets/blinkythm.ico
          --collect-all mediapipe
          --add-data "assets/sprites;assets/sprites"
          --add-data "assets/sounds;assets/sounds"
          --add-data "assets/fonts;assets/fonts"
          --add-data "assets/music;assets/music"
          --add-data "assets/models;assets/models"
          --hidden-import pystray._win32
          main.py

      - name: Smoke test (imports inside the bundle)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Blinkythm/Blinkythm.exe" -ArgumentList "--sim","--demo" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Blinkythm.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      # Signing runs only after the SignPath settings exist in the repository
      # (see CODE_SIGNING_POLICY.md and the README). Without them the build stays unsigned.
      - name: Upload unsigned build for signing
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Blinkythm-unsigned
          path: dist/Blinkythm

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use the signed build
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/Blinkythm.exe
          if (-not $sig.SignerCertificate) { throw "signed/Blinkythm.exe has no signature" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject) ($($sig.Status))"
          Remove-Item -Recurse -Force dist/Blinkythm
          Move-Item signed dist/Blinkythm
          echo "SIGNED=1" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "${{ inputs.tag }}" }
          $name = if ($tag) { "Blinkythm-$tag-win64" } else { "Blinkythm-dev-win64" }
          Compress-Archive -Path dist/Blinkythm -DestinationPath "$name.zip"
          echo "ASSET=$name.zip" >> $env:GITHUB_ENV
          if ($tag) {
            $notes = Get-Content -Raw "docs/releases/$tag.md"
            if ($env:SIGNED) {
              $notes += "`nFree code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).`n"
            }
            Set-Content -Path release-notes.md -Value $notes -NoNewline
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Blinkythm-win64
          path: ${{ env.ASSET }}

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Blinkythm ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          body_path: release-notes.md
          files: ${{ env.ASSET }}

  notes:
    if: ${{ inputs.notes_only && inputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "docs/releases/$TAG.md"
